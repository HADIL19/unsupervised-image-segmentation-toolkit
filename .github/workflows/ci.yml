name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies (OpenCV runtime libs)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with flake8
        run: |
          flake8 imgseg tests app.py --max-line-length=140 --extend-ignore=E203,W503

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: |
          pytest -v
